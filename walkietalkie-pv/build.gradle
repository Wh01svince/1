plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
}

repositories {
    mavenCentral()
    maven { name = 'plasmoverse-releases'; url = 'https://repo.plasmoverse.com/releases' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Plasmo Voice API (ตัวม็อด Plasmo Voice ต้องลงในเกมเองตอนเล่น)
    compileOnly "su.plo.voice.api:server:${plasmo_voice_version}"
    compileOnly "su.plo.voice:protocol:${plasmo_voice_version}"
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

jar.finalizedBy('reobfJar')
